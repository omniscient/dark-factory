# .claude/skills/refinement/config.yaml
scheduler:
  poll_interval: 60              # seconds between polls; env: POLL_INTERVAL overrides
  max_retries: 3                 # per-issue retry limit before trip_to_blocked; env: MAX_RETRIES overrides
  rate_limit_floor: 200          # pause polling when GraphQL remaining < this; env: RATE_LIMIT_FLOOR overrides
  factory_wip_limit: 1           # max concurrent factory containers; env: FACTORY_WIP_LIMIT overrides
  main_red_recheck_enabled: true # periodically recheck a red main to self-clear (#365); env: MAIN_RED_RECHECK_ENABLED overrides
  main_red_recheck_minutes: 20   # interval between red-main recheck dispatches; env: MAIN_RED_RECHECK_MINUTES overrides
  blocked_rescue_enabled: true   # promote a Blocked ticket whose PR is green+mergeable to In review instead of re-running it; env: BLOCKED_RESCUE_ENABLED overrides
  session_window_backoff_enabled: true   # read by the run container's entrypoint.sh, not by scheduler.sh; env: SESSION_WINDOW_BACKOFF_ENABLED overrides — false = old sleep-forever fallback
  session_window_buffer_minutes: 5       # added to a parsed resetsAt; env: SESSION_WINDOW_BUFFER_MINUTES overrides
  session_window_fallback_minutes: 30    # pause length when the reset time can't be parsed; env: SESSION_WINDOW_FALLBACK_MINUTES overrides

refine:
  wip_limit: 2                   # env: REFINE_WIP_LIMIT overrides
  skip_labels:
    - needs-discussion
    - epic
    - spec-pending-review
  min_issue_body_length: 20

plan:
  skip_labels:
    - needs-discussion
    - epic
    - plan-pending-review

direct_to_pr:
  label: direct-to-pr          # env: DIRECT_TO_PR_LABEL overrides
  spec_grace_minutes: 30        # env: SPEC_GRACE_MINUTES overrides — 0 = advance on next poll
  plan_grace_minutes: 30        # env: PLAN_GRACE_MINUTES overrides — 0 = advance on next poll

conformance:
  enabled: true
  max_reconcile_cycles: 3
  block_on_material: true
  scope_enforcement: true    # detect & remediate out-of-scope changes at the conformance gate
  excise_out_of_scope: true  # revert out-of-scope changes from the branch (false = file backlog ticket only)
  backlog_label: scope-spillover  # label applied to auto-created spillover tickets
  shadow_model: claude-fable-5-1  # env: CONFORMANCE_SHADOW_MODEL overrides (unset falls back to this; explicitly empty = no shadow spawn)

code_review:
  enabled: true
  block_threshold: high     # findings at this severity or above block (critical|high|medium|low)
  fail_open: true           # reviewer error / unparseable output → advisory, never block
  max_findings: 50          # cap inline comments to avoid spam (log if exceeded)
  severity_order:           # ascending rank — lowest to highest; sourced by code_review_payload.py
    - low
    - medium
    - high
    - critical

docs_conformance:            # Gate 2.5 (#535): docs vs the final post-Gate-2 diff, before push-and-pr
  enabled: true              # false = the command writes STATUS: SKIPPED (passes in both modes)
  mode: observe              # observe = record the verdict, which never blocks; enforce = fail closed on
                             # BLOCKED/ERROR/missing. Flipping to enforce is a separate reviewed change (#536)

preview:
  enabled: true   # false = always build the preview (pre-differentiator behavior) — kill-switch
  model: haiku

conflict_resolution:
  enabled: true       # env: CONFLICT_RESOLUTION_ENABLED overrides — false = disable P1.5 conflict scanner
  ai_tier: true       # env: CONFLICT_RESOLUTION_AI_TIER overrides — false = only Tier 1 (mechanical) resolution

blast_radius:
  enabled: true
  hotspot_score_floor: 5.0      # files at or above this codeindex blast score trigger HUMAN_REQUIRED
  size_budget_lines: 400        # total added+deleted lines threshold. 0 does NOT disable it: with size_budget_blocks: true, 0 makes every non-empty diff trip the size trigger
  size_budget_blocks: false     # true = size alone is blocking; false = advisory only

dispatch_ceiling:
  enabled: true                # env: DISPATCH_CEILING_ENABLED overrides — kill-switch
  label: above-ceiling         # env: ABOVE_CEILING_LABEL overrides
  keywords: "migration|migrate|performance|perf|architectur|refactor"  # env: ABOVE_CEILING_KEYWORDS overrides
  # XL tickets always park in Blocked for human pairing; M tickets park only on a
  # keyword title match; L tickets are never parked. M tickets (whether or not they
  # park) lose the plan-pending-review grace-window auto-advance. S is unaffected.
  # See docs/archive/2026-06-12-size-type-aware-dispatch-ceiling.md
  # Revisit: 2026-09-12

epic_autopilot:
  enabled: false              # kill-switch — ship OFF. env: EPIC_AUTOPILOT_ENABLED overrides
  model: claude-opus-5-5      # reviewer model. env: EPIC_AUTOPILOT_MODEL overrides
  daily_cap: 5                # max autonomous advances / UTC day. env: EPIC_AUTOPILOT_DAILY_CAP overrides
  confidence_floor: 0.7       # min Opus confidence to ADVANCE. env: EPIC_AUTOPILOT_CONFIDENCE_FLOOR overrides
  hold_ttl_hours: 24          # re-review a cached HOLD after this many hours. env EPIC_AUTOPILOT_HOLD_TTL_HOURS
  size_ceiling: XL            # drop only at/above this size (L/M now eligible). env EPIC_AUTOPILOT_SIZE_CEILING
  start_epics: true           # when no gated child is advanceable, promote the next Ready epic. env EPIC_AUTOPILOT_START_EPICS
  allow_self_improvement: true # factory-self work (dark-factory/, scheduler.sh, factory_core/, .archon/) is autopilot-eligible:
                               # self epics can be started and self children advanced. Trading/auth exclusions are unaffected.
                               # env: EPIC_AUTOPILOT_ALLOW_SELF_IMPROVEMENT overrides (code default: false, fail-closed)
  sensitive_keywords: "trading|ibkr|live order|notional|authentication|authorization|authn|authz|jwt|oauth|rbac|/auth"
  opt_out_label: no-autopilot # per-ticket veto label. env: EPIC_AUTOPILOT_OPT_OUT_LABEL overrides
  hard_exclude_paths:         # spec target paths matching any of these → excluded before Opus (fail-closed)
    # The first four (factory-self) are ignored when allow_self_improvement is true;
    # the trading/auth and Claude Skills entries below always apply.
    # Kept byte-identical to adapter_defaults.DEFAULTS["safety"]["hard_exclude_paths"]
    # (tests/test_adapter.py::test_config_yaml_hard_exclude_paths_matches_defaults).
    - "dark-factory/"
    - ".archon/"
    - "scheduler.sh"
    - "factory_core/"
    - "app/services/trading"
    - "app/tasks/trading.py"
    - "app/core/auth"
    - "app/routers/auth"
    - ".claude/skills/"
    - ".claude/settings.json"
    - ".claude/settings.local.json"
    - ".mcp.json"
    - ".claude/plugins/"
    - ".claude-plugin/"
    - ".factory/hooks/"
  # When starved (a poll dispatched nothing) and main is green, review the refined, below-ceiling
  # children of in-progress epics with Opus and advance the low-risk ones via direct-to-pr.
  # See docs/archive/2026-06-20-epic-autopilot-design.md

main_red_autofix:
  # kill-switch — ships OFF. To ENABLE, set MAIN_RED_AUTOFIX_ENABLED=true in .archon/.env
  # (like EPIC_AUTOPILOT_ENABLED): the dispatched "Fix main" container reads .archon/.env, NOT this
  # file, so flipping `enabled` here alone does NOT turn the feature on. env MAIN_RED_AUTOFIX_ENABLED
  enabled: false
  model: claude-opus-5-5      # fix-agent model (container default; env MAIN_RED_AUTOFIX_MODEL)
  max_attempts: 3             # fix→CI cycles per red event (container default; env MAIN_RED_AUTOFIX_MAX_ATTEMPTS)
  throttle_minutes: 15        # min minutes between fixer dispatches (scheduler; env MAIN_RED_AUTOFIX_THROTTLE_MIN)
  ci_wait_minutes: 20         # bounded wait for branch CI (container default; env MAIN_RED_AUTOFIX_CI_WAIT_MINUTES)

deps_audit:
  # Dependency-health loop (#484): daily .factory/hooks/deps-audit run → tracking issue →
  # deterministic .factory/hooks/deps-fix → one bounded claude -p pass → PR for approval.
  # kill-switch — ships OFF, and this key is documentation only (no code reads it). To ENABLE
  # set DEPS_AUDIT_ENABLED=true in BOTH environments: deploy/instance.env (the scheduler, which
  # dispatches "Audit deps" and never loads .archon/.env) AND .archon/.env (the run container).
  # DEPS_AUDIT_INTERVAL_HOURS is scheduler-side (instance.env); the other four are run-side.
  # Targets without a deps-audit hook stay inactive even when enabled.
  enabled: false
  interval_hours: 24          # min hours between "Audit deps" dispatches (scheduler; env DEPS_AUDIT_INTERVAL_HOURS)
  model: claude-opus-5-5      # fix-agent model (container default; env DEPS_AUDIT_MODEL)
  max_attempts: 3             # fix attempts per advisory set before ready-for-human (container default; env DEPS_AUDIT_MAX_ATTEMPTS)
  ci_wait_minutes: 20         # bounded wait for the deps PR's CI (container default; env DEPS_AUDIT_CI_WAIT_MINUTES)
  auto_merge: false           # merge the deps PR on green only when true (container default; env DEPS_AUDIT_AUTO_MERGE); direct-to-pr on the tracking issue also allows it

side_effect:
  # Side-effect level each factory phase runs at (#196). 1..5; 6 is never valid here
  # (adapter.py/handoff.py reject 6 outright — see side_effect.py). All phases start at
  # 5 (today's unrestricted behavior). Tightening any phase (e.g. refine/plan -> 4) is a
  # separate, later, reviewed change (see #196's F2 follow-up).
  # env: SIDE_EFFECT_LEVEL_<PHASE> overrides one phase (e.g. SIDE_EFFECT_LEVEL_REFINE=4).
  phase_levels:
    refine: 5
    plan: 5
    implement: 5
    validate: 5
    conformance: 5
    code_review: 5
    revise_advisory: 5  # #196 plan-level addition (revise-advisory node) — see Architecture note
    deconflict: 5  # entrypoint.sh's own $INTENT=deconflict flow — inline, never through archon; deconflict.py:143 runs a claude -p session
    fix_main: 5  # entrypoint.sh's $INTENT=fix-main -- a standalone `claude -p` session (main_red_fixer.py), not a DAG node
    audit_deps: 2  # entrypoint.sh's $INTENT=audit-deps -- lowered from 5 (#548): deps_fixer.py's push/PR calls (LiveIO.start_branch/changed_paths/open_pr) are plain harness subprocesses, never under CLAUDECODE=1, so the git/gh shim never gates them; only apply_agent_fix's claude -p session is gated, and it needs local edits + local git only (level 2: push/tag/remote set-url denied, gh read verbs only -- side_effect.py profile 2)

token_optimization:
  enforce_budgets: true       # true = enforce budgets for per-scenario enforce: true scenarios; env: TOKEN_OPTIMIZATION_ENFORCE_BUDGETS=false|0|no is a kill-only override read by scripts/budget_gate.sh (forces observe; can never force enforce on); other rollback is a git commit to main (see runbook)
  default_budget_tokens: 30000  # per-scenario budget when budgets.<scenario> is absent (read by budget_gate.sh); no env override
  budgets:
    refine: 30000
    plan: 30000
    implement: 30000
    conformance: 22000         # provisional from T5 smoke run; recalibrate per runbook Follow-up Path (docs/dark-factory-token-optimization.md)
    code-review: 22000         # provisional from T5 smoke run; recalibrate per runbook Follow-up Path (docs/dark-factory-token-optimization.md)
    docs-conformance: 22000    # #535: uncalibrated; mirrors conformance until observe-mode telemetry exists
  enforce:
    refine: true               # T3b: enforcement live — #733 via #731 scorecard: 0% section_at_risk
    plan: true                 # T3b: enforcement live — #733 via #731 scorecard: 0% section_at_risk
    implement: false
    conformance: true          # T6: enforcement live — 0% section_at_risk in T5 calibration
    code-review: true          # T6: enforcement live — 0% section_at_risk in T5 calibration
    docs-conformance: false    # #535: observe until calibrated, like implement
  issue_context:
    reserve_tokens: 2000      # minimum token reservation for issue_context (floor applied even when actual < reserve)
  architecture:
    enabled: true             # false = skip slicing, load full ARCHITECTURE.md; env: TOKEN_OPTIMIZATION_ARCHITECTURE_ENABLED overrides
    mode: slice               # slice = emit only the changed file excerpt + its direct callers
    max_tokens: 5000          # derivation input for budget_enforce.py, not a live cap: architecture_slice.py applies only env TOKEN_OPTIMIZATION_ARCHITECTURE_MAX_TOKENS
    min_tokens: 2500          # floor for budget_enforce.py proportional distribution (50% of max_tokens)
  memory:
    enabled: true             # false = skip top-k cap, emit all matching entries; env: TOKEN_OPTIMIZATION_MEMORY_ENABLED overrides
    mode: top_k               # top_k = emit only the K highest-scored memory entries
    max_entries: 8            # max memory entries surfaced per phase (baked — no env override)
    max_tokens: 1500          # token ceiling for memory context per phase; env TOKEN_OPTIMIZATION_MEMORY_MAX_TOKENS takes priority (memory_retrieve.py)
    min_tokens: 750           # floor for budget_enforce.py proportional distribution (50% of max_tokens)
  comments:
    enabled: true             # NOT consulted by the comment-digest gate in a run (it reads only env TOKEN_OPTIMIZATION_COMMENTS_ENABLED); scheduler.sh exports this value into its own process, which does not reach run containers
    digest_after_factory_marker: true  # collapse comment blocks below the factory marker into a one-line digest
    max_tokens: 2000          # derivation input for budget_enforce.py, not a live cap: comment_digest.py applies only env TOKEN_OPTIMIZATION_COMMENTS_MAX_TOKENS
    min_tokens: 1000          # floor for budget_enforce.py proportional distribution (50% of max_tokens)
  diff:
    enabled: true             # false = skip diff ranking/truncation, emit full diff; env: TOKEN_OPTIMIZATION_DIFF_ENABLED overrides
    max_review_tokens: 6000   # token ceiling for diff context fed to the code-review sub-stage; env TOKEN_OPTIMIZATION_DIFF_MAX_REVIEW_TOKENS overrides (diff_rank.py)
    min_review_tokens: 3000   # floor for budget_enforce.py proportional distribution (50% of max_review_tokens)
  escalation:
    opus_only_for:            # scenario tags matched by factory command files (dark-factory-implement.md, etc.); reserved — nothing reads it today
      - security
      - trading
      - auth
      - high_blast_radius
      - material_conformance_uncertainty
