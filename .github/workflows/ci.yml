name: CI
on:
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml aiohttp
      - run: python -m pytest tests/ -v
        env: { PYTHONPATH: scripts }
      - run: bash tests/test_identity.sh
      - run: bash tests/test_hooks.sh
      - run: bash tests/test_smoke_gate.sh
      - run: bash tests/test_side_effect_shims.sh
      - run: bash tests/test_run_compose.sh
      - run: bash tests/test_provider_env_flags.sh
      - run: bash tests/test_model_proxy_compose.sh
      - run: bash tests/test_build_network_compose.sh
      - run: bash tests/test_model_proxy_smoke.sh
      - run: bash tests/test_entrypoint_current_run.sh
      - run: sudo install -d -m 777 /var/lib/dark-factory
      - run: bash tests/test_entrypoint_preflight.sh
      - run: bash tests/test_entrypoint_clone_url.sh
      - run: bash tests/test_entrypoint_staged_excludes.sh
      - run: bash tests/test_entrypoint_session_window.sh
      - run: bash tests/test_entrypoint_error_signature.sh
      - run: bash tests/test_entrypoint_adapter_validate.sh
      - run: bash tests/test_entrypoint_conflict_escalate.sh
      - name: Assert none of the entrypoint tests touched /var/lib/dark-factory
        run: test -z "$(ls -A /var/lib/dark-factory)"
      - name: Remove the /var/lib/dark-factory scratch dir
        if: always()
        run: sudo rm -rf /var/lib/dark-factory
      - run: bash tests/test_cost_report_endpoint.sh
      - run: bash tests/test_cost_report_harness_economics.sh
      - run: bash tests/test_run_record_hermetic.sh
      - run: bash tests/test_entrypoint_cost_report_regression.sh
      - run: bash tests/test_entrypoint_cost_report_comment.sh
      - run: bash tests/test_budget_gate.sh
      - run: bash tests/test_verdict_gate_check.sh
      - run: bash tests/test_budget_context.sh
      - run: bash tests/test_scheduler_lib.sh
      - run: bash tests/test_gate_diff_md_visibility.sh
  dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/check_workflow_dag.py workflows/archon-dark-factory.yaml
      - run: python scripts/check_workflow_when.py workflows/archon-dark-factory.yaml
      - run: python scripts/docs_refs_check.py docs/run-lifecycle.md docs/scheduler.md docs/features.md docs/configuration.md
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t dark-factory:pr .
      # SPIKE for #465 (do not merge): can bwrap create user namespaces inside the PR image on this runner?
      - name: bwrap probe (seccomp/apparmor unconfined)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          docker run --rm --network none --security-opt seccomp=unconfined --security-opt apparmor=unconfined --entrypoint bash dark-factory:pr -c 'id; bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-net --die-with-parent --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /bin/true; echo "probe_rc=$?"'
      - name: bwrap probe (default confinement, expected to fail)
        if: always()
        run: |
          docker run --rm --network none --entrypoint bash dark-factory:pr -c 'bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-net --die-with-parent --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /bin/true; echo "probe_rc=$?"' || true
